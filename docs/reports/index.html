<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encrypted Daily Portfolio Report Archive</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --border: #d8e1ec;
      --text: #172033;
      --muted: #5e6b7d;
      --accent: #1d6fd8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    main {
      width: min(900px, 100%);
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(23, 32, 51, 0.08);
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(26px, 5vw, 38px);
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    .latest {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      white-space: nowrap;
    }

    ol {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    li {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      background: #fff;
    }

    .empty {
      color: var(--muted);
      justify-content: flex-start;
    }

    time { color: var(--muted); }

    @media (max-width: 620px) {
      header { display: grid; }
      .latest { justify-content: center; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Encrypted Daily Portfolio Report Archive</h1>
        <p>Reports are published as encrypted files and opened in the browser with your report password.</p>
      </div>
      <a class="latest" href="viewer.html?report=latest.enc.json">Open Latest</a>
    </header>

    <ol>
      <li>
        <a href="viewer.html?report=portfolio-report-2026-06-19.enc.json">Daily Portfolio Report — Pipeline Test</a>
        <time datetime="2026-06-19">2026-06-19</time>
      </li>
    </ol>
  </main>
</body>
</html>
